<circle id="city-hub-rim" cx="380" cy="215" r="77.5" fill="none" stroke="#0b0e19" stroke-width="5" pointer-events="none" /><g id="place-label-notes" font-size="7.3" fill="#bdc9da"><text x="32" y="817">Arrows indicate continuation beyond the drawn section.</text><text x="32" y="828">22 / 24 / 25 / 27 show shared route-family corridors.</text></g></svg>
<script>
(function () {
  const svg = document.querySelector('svg');
  // casings: dark outline under each route so crossings read cleanly
  const cas = document.getElementById('casings');
  document.querySelectorAll('path.line').forEach(p => {
    const c = p.cloneNode(); c.removeAttribute('class');
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#10131f'); c.setAttribute('stroke-width', p.getAttribute('data-casing-width') || '9.5');
    c.setAttribute('stroke-linecap', 'round'); c.setAttribute('stroke-linejoin', 'round');
    cas.appendChild(c);
  });
  // move casings just before first route line
  const first = document.querySelector('path.line'); first.parentNode.insertBefore(cas, first);
  // rounded badges
  document.querySelectorAll('rect').forEach(r => {
    if (+r.getAttribute('width') <= 50 && +r.getAttribute('height') <= 12 && !r.getAttribute('rx')) r.setAttribute('rx', '2');
  });
  function apply() {
    document.getElementById('notes').style.display = document.getElementById('t-notes').checked ? '' : 'none';
    document.getElementById('place-label-notes').style.display = document.getElementById('t-notes').checked ? '' : 'none';
    cas.style.display = document.getElementById('t-casing').checked ? '' : 'none';
    try { localStorage.setItem('posterOpts2', JSON.stringify(['t-notes','t-casing'].map(i => document.getElementById(i).checked))); } catch (e) {}
  }
  try {
    const saved = JSON.parse(localStorage.getItem('posterOpts2'));
    if (saved) ['t-notes','t-casing'].forEach((i, n) => document.getElementById(i).checked = saved[n]);
  } catch (e) {}
  document.querySelectorAll('.controls input').forEach(i => i.addEventListener('change', apply));
  document.getElementById('dl').addEventListener('click', () => {
    const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'frequent-network-poster.svg'; a.click();
  });
  apply();
})();
</script>
